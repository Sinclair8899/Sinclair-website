name: Daily News Crawler

on:
  # Schedule disabled 2026-08-01: the produced data/research_news.md is not
  # consumed by the site (it is also the file that breaks site.Data for the
  # whole repo). Manual trigger kept; re-enable the cron only with a stated
  # external use for the output.
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch: # 這讓你可以在網頁上「手動」點擊按鈕立即執行

concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝套件
        run: pip install PyGithub requests beautifulsoup4

      - name: 執行爬蟲腳本
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: python test_github.py

name: Daily Research News

on:
  schedule:
    # 21:50 UTC daily — 20 min after the market brief so the two content
    # workflows never race each other onto main. News runs weekends too.
    - cron: '50 21 * * *'
  workflow_dispatch:

# Same group as update-market-brief.yml: serializes pushes to main.
concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  research-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Generate research news digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not set; skipping news generation."
            exit 0
          fi
          python3 .github/scripts/update_news.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Build Hugo site
        run: hugo --destination docs

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/news_daily.json docs
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📰 Daily research news $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

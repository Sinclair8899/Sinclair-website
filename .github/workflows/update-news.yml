name: Daily Research News

on:
  schedule:
    # 21:50 UTC daily — 20 min after the market brief so the two content
    # workflows never race each other onto main. News runs weekends too.
    - cron: '50 21 * * *'
  workflow_dispatch:

# Same group as update-market-brief.yml: serializes pushes to main.
concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  research-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Require API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ERROR: ANTHROPIC_API_KEY secret not set. Frozen semantics:" >&2
            echo "a missing key is a run FAILURE (archive untouched), never a skip." >&2
            exit 1
          fi

      # The generator's own exit code gates everything below: any non-zero
      # here fails the job and no stage/commit/push step runs. Never wrap
      # this in continue-on-error or follow it with always().
      - name: Generate research news digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/update_news.py

      # generated=true/false is decided by the actual git diff of the two
      # approved paths, never by the generator's exit code alone.
      # digest_date is read from the generator's frozen product (the newest
      # archive record), never from the runner clock.
      - name: Detect approved changes
        id: gate
        run: bash .github/scripts/news_workflow_gate.sh detect

      - name: Stage approved paths
        if: ${{ success() && steps.gate.outputs.generated == 'true' }}
        run: bash .github/scripts/news_workflow_gate.sh stage

      - name: Commit digest
        if: ${{ success() && steps.gate.outputs.generated == 'true' }}
        run: bash .github/scripts/news_workflow_gate.sh commit "${{ steps.gate.outputs.digest_date }}"

      # Plain fast-forward push only. A non-fast-forward failure fails the
      # run and is left as evidence; the gate script never pulls, rebases,
      # merges or force-pushes.
      - name: Push
        if: ${{ success() && steps.gate.outputs.generated == 'true' }}
        run: bash .github/scripts/news_workflow_gate.sh push

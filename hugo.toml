publishDir = "docs"
baseURL = "https://sinclairhuang.org/"
languageCode = "en-us"
title = "Sinclair Huang, HEC Liège, Executive DBA"
theme = "PaperMod"

[params]
    env = "production"
    title = "Sinclair Huang"
    description = "AI, Physical Infrastructure, and Capital Markets Researcher"
    


# 3D: seven-item nav. Publications and Blog left the top nav only — their
# pages and URLs are intact and reachable from /writing/.
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about"
    weight = 2
  [[menu.main]]
    name = "Research"
    url = "/research"
    weight = 3
  [[menu.main]]
    name = "Lab"
    url = "https://lab.sinclairhuang.org/"
    weight = 4
  [[menu.main]]
    name = "Writing"
    url = "/writing"
    weight = 5
  [[menu.main]]
    name = "News"
    url = "/news"
    weight = 6
  [[menu.main]]
    name = "Market Brief"
    url = "/market-brief"
    weight = 7
  [[menu.main]]
    name = "Advisory"
    url = "/advisory"
    weight = 8

# 3B: taxonomy pages (tags/categories, list + term) keep their URLs but
# leave the sitemap; the matching noindex,follow meta lives in the
# layouts/partials/head.html theme override. primary_cluster stays a page
# param — no cluster taxonomy is registered here.
[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade._target]
    kind = "taxonomy"

[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade._target]
    kind = "term"

[markup.goldmark.renderer]
  unsafe = true
